version: 2

models:
  - name: stg_weather_daily
    description: Clima diario limpio y con nombres/unidades estandarizadas.
    data_tests:
      - unique_combination:
          arguments:
            columns: [city_id, weather_date]
    columns:
      - name: city_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: city_id
      - name: weather_date
        data_tests: [not_null]
      - name: precipitation_mm
        data_tests:
          - non_negative

  - name: stg_cities
    description: Catálogo de ciudades monitoreadas (seed).
    columns:
      - name: city_id
        data_tests: [unique, not_null]
      - name: natural_region
        data_tests:
          - accepted_values:
              arguments:
                values: ['Costa', 'Sierra', 'Selva']
