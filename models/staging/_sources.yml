version: 2

sources:
  - name: raw
    description: Datos crudos cargados por pipeline/extract.py desde la API Open-Meteo.
    schema: raw
    tables:
      - name: weather_daily
        description: Clima diario por ciudad (una fila por ciudad y día).
        loaded_at_field: _ingested_at
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 10, period: day}
        columns:
          - name: city_id
            data_tests: [not_null]
          - name: date
            data_tests: [not_null]
      - name: ingestion_log
        description: Bitácora de ejecuciones de la ingesta (una fila por ciudad y corrida).
